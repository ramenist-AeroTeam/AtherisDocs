<!doctype html>
<html lang="en">
  <head>
  <style>
  /* Hide original Lovable badge text */
  #lovable-badge-cta > * {
    display: none !important;
  }

  /* Custom RAMENI label */
  #lovable-badge-cta::after {
    content: "🍜 rameni";
    font-weight: 700;
    color: white;
    font-size: 13px;
  }

  /* Steam particles */
  .rameni-steam {
    position: fixed;
    bottom: 52px;
    right: 18px;
    pointer-events: none;
    z-index: 1000001;
    display: flex;
    gap: 5px;
    align-items: flex-end;
  }

  .rameni-steam span {
    display: block;
    width: 4px;
    border-radius: 4px;
    background: rgba(255, 220, 100, 0.7);
    animation: steamRise 1.6s ease-in infinite;
    transform-origin: bottom center;
  }

  .rameni-steam span:nth-child(1) { height: 10px; animation-delay: 0s;   animation-duration: 1.4s; }
  .rameni-steam span:nth-child(2) { height: 14px; animation-delay: 0.3s; animation-duration: 1.7s; }
  .rameni-steam span:nth-child(3) { height: 8px;  animation-delay: 0.6s; animation-duration: 1.5s; }

  @keyframes steamRise {
    0%   { transform: translateY(0)    scaleX(1);   opacity: 0.8; }
    50%  { transform: translateY(-10px) scaleX(1.4); opacity: 0.5; }
    100% { transform: translateY(-20px) scaleX(0.6); opacity: 0; }
  }

  /* Badge glow pulse */
  @keyframes ramenGlow {
    0%, 100% { box-shadow: 0 0 6px 1px rgba(255, 200, 60, 0.3); }
    50%       { box-shadow: 0 0 14px 4px rgba(255, 200, 60, 0.7); }
  }

  #lovable-badge-cta {
    animation: ramenGlow 2s ease-in-out infinite !important;
    pointer-events: none !important;
  }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const badge = document.getElementById("lovable-badge-cta");
      if (badge) {
        badge.href = "javascript:void(0)";
        badge.removeAttribute("target");

        const steam = document.createElement("div");
        steam.className = "rameni-steam";
        steam.innerHTML = "<span></span><span></span><span></span>";
        document.body.appendChild(steam);
      }
    });
  </script>
